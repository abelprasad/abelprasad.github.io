<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abel Prasad | Software Engineer</title>
    <meta name="description" content="Abel Prasad — Associate Software Engineer at Ascensus. Building defense flight intelligence, autonomous agents, and production systems. Penn State CS, Dec 2026.">
    <script>
      // Handle redirects from 404.html for client-side routing
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.pathname) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: '#060609',
                            panel: '#0b0b12',
                            purple: '#a855f7',
                            darkPurple: '#6b21a8',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #060609;
            color: #ffffff;
            scroll-behavior: smooth;
        }
        .bg-grid {
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 48px 48px;
        }
        .radar-sweep {
            background: conic-gradient(from 0deg, rgba(168,85,247,0.12), transparent 70deg);
            animation: radar-spin 9s linear infinite;
            -webkit-mask-image: radial-gradient(circle, black 30%, transparent 70%);
            mask-image: radial-gradient(circle, black 30%, transparent 70%);
        }
        @keyframes radar-spin {
            to { transform: rotate(360deg); }
        }
        .text-gradient {
            background: linear-gradient(to right, #ffffff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card-hover {
            transition: border-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card-hover:hover {
            border-color: rgba(168,85,247,0.5);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px -12px rgba(168,85,247,0.25);
        }
        .status-dot {
            position: relative;
        }
        .status-dot::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            background: currentColor;
            animation: ping-soft 2s cubic-bezier(0,0,0.2,1) infinite;
        }
        @keyframes ping-soft {
            0% { transform: scale(1); opacity: 0.7; }
            80%, 100% { transform: scale(2.6); opacity: 0; }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #060609; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 0; }
        ::-webkit-scrollbar-thumb:hover { background: #a855f7; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
</body>
</html>
