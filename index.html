<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abel Prasad | Software Engineer</title>
    <meta name="description" content="Abel Prasad \u2014 Associate Software Engineer at Ascensus. Building flight intelligence systems, autonomous agents, and production software. Penn State CS, Dec 2026.">
    <script>
      // Handle redirects from 404.html for client-side routing
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.pathname) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: '#050805',
                            panel: '#0a0f0a',
                            green: '#33ff33',
                            darkGreen: '#1a8a1a',
                            dim: '#0f2a0f',
                            amber: '#ffb000',
                        }
                    },
                    fontFamily: {
                        sans: ['JetBrains Mono', 'ui-monospace', 'monospace'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050805;
            color: #c9d4c9;
            scroll-behavior: smooth;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            text-shadow: 0 0 6px rgba(51, 255, 51, 0.16);
        }
        ::selection {
            background: #33ff33;
            color: #050805;
            text-shadow: none;
        }
        .glow {
            text-shadow: 0 0 10px rgba(51, 255, 51, 0.55), 0 0 32px rgba(51, 255, 51, 0.22);
        }
        .glow-dim {
            text-shadow: 0 0 8px rgba(51, 255, 51, 0.3);
        }
        /* CRT scanlines + vignette overlays (mounted in App) */
        .crt-scanlines {
            position: fixed;
            inset: 0;
            z-index: 90;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 2px,
                rgba(0, 0, 0, 0.16) 3px,
                rgba(0, 0, 0, 0.16) 4px
            );
        }
        .crt-vignette {
            position: fixed;
            inset: 0;
            z-index: 91;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 52%, rgba(0, 0, 0, 0.52) 100%);
        }
        @media (prefers-reduced-motion: no-preference) {
            .crt-scanlines {
                animation: crt-flicker 4s infinite;
            }
        }
        @keyframes crt-flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.96; }
        }
        @media (max-width: 768px) {
            .crt-scanlines { opacity: 0.55; }
            .crt-vignette { opacity: 0.7; }
            body { text-shadow: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            .crt-scanlines { animation: none; }
            .blink { animation: none !important; }
        }
        .blink {
            animation: blink 1.1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .bg-grid {
            background-image:
                linear-gradient(rgba(51, 255, 51, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(51, 255, 51, 0.035) 1px, transparent 1px);
            background-size: 48px 48px;
        }
        .card-hover {
            transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
        }
        .card-hover:hover {
            border-color: rgba(51, 255, 51, 0.55);
            transform: translateY(-3px);
            box-shadow: 0 0 24px -6px rgba(51, 255, 51, 0.35), inset 0 0 24px rgba(51, 255, 51, 0.04);
        }
        .status-dot {
            position: relative;
        }
        .status-dot::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            background: currentColor;
            animation: ping-soft 2s cubic-bezier(0,0,0.2,1) infinite;
        }
        @keyframes ping-soft {
            0% { transform: scale(1); opacity: 0.7; }
            80%, 100% { transform: scale(2.6); opacity: 0; }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050805; }
        ::-webkit-scrollbar-thumb { background: #1a3a1a; border-radius: 0; }
        ::-webkit-scrollbar-thumb:hover { background: #33ff33; }
        input, textarea, button {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
        }
        input::placeholder, textarea::placeholder {
            color: #3a5a3a;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
</body>
</html>
